repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.11
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: ["--check"]

  - repo: local
    hooks:
      - id: unit-tests
        name: Run unit tests
        entry: >
          python -m unittest
          tests.test_artwork
          tests.test_normalization
          tests.test_price_book
          tests.test_limited_editions
          -v
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        
      - id: integration-tests
        name: Run integration tests
        entry: python -m unittest tests.test_api -v
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
